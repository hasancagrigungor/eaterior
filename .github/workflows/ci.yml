name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e python build twine
      - run: python -m unittest discover -s python/tests -v
      - run: eateryplan validate examples/plan.json
      - run: eateryplan import examples/detection.json /tmp/imported.json
      - run: eateryplan check-objects examples/restaurant.json examples/restaurant-objects.json

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: js

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --outdir dist python && python -m twine check dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack --dry-run
        working-directory: js
