<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eatery Plan Viewer</title>
<style>
  :root { --bg: #f6f7f9; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1f25; --text: #e6e8eb; --muted: #9aa3ad; --line: #2b323a; --accent: #2dd4bf; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .stage { background: #fff; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .stage svg { width: 100%; height: auto; display: block; }
  .stage [data-ref-type="table"] { cursor: pointer; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-self: start; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 16px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  .legend { display: grid; grid-template-columns: 14px 1fr; gap: 6px 8px; align-items: center; }
  .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #0002; }
  .err { color: #b91c1c; }
  .controls { display: grid; gap: 10px; margin: 0 0 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .controls label { color: var(--text); justify-content: space-between; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); }
  .controls .muted { color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Eatery Plan viewer</h1>
  <label>Plan
    <select id="plan">
      <option value="../examples/restaurant.json">Garden Bistro (restaurant)</option>
      <option value="../examples/showcase.json">Component gallery</option>
      <option value="../examples/plan.json">Sample bistro</option>
      <option value="../examples/imported-plan.json">Imported sketch</option>
    </select>
  </label>
  <label>Theme
    <select id="theme">
      <option value="illustrated">Illustrated</option>
      <option value="plain">Plain</option>
    </select>
  </label>
  <label><input type="checkbox" id="walls3d" checked> 3D walls</label>
  <label><input type="checkbox" id="animate" checked> Animate effects</label>
  <label><input type="checkbox" id="live" checked> Live table state</label>
  <label><input type="checkbox" id="chairs" checked> Chairs</label>
  <label><input type="checkbox" id="review" checked> Highlight “needs review”</label>
  <label><input type="file" id="file" accept="application/json,.json" hidden><button id="open" type="button">Open JSON…</button></label>
</header>
<main>
  <div class="stage" id="stage" aria-live="polite"></div>
  <aside>
    <h2>Selection</h2>
    <dl id="info"><dt>Tip</dt><dd>Click any object: a table, the pergola, a glass wall, a heater…</dd></dl>
    <div id="controls"></div>
    <h2>Table status</h2>
    <div class="legend" id="legend"></div>
  </aside>
</main>
<script type="module">
  import { buildScene, toSvg, DEFAULT_THEME, objectStateMap, resolveState } from "../js/src/eateryplan-render.mjs";
  import { buildIllustratedScene, ILLUSTRATED_THEME } from "../js/src/eateryplan-illustrated.mjs";

  const $ = (id) => document.getElementById(id);
  let plan = null, telemetry = null;
  const states = [];
  const objectStates = new Map();          // planId -> Map(objectId -> live state); edited by the controls
  const rawObjectDocs = new Map();         // planId -> object-state document (entries may use external ids)
  const objStatesFor = (p) => {
    if (!objectStates.has(p.planId)) objectStates.set(p.planId, objectStateMap(rawObjectDocs.get(p.planId) || null, p));
    return objectStates.get(p.planId);
  };
  const APPLIANCES = ["stove", "oven", "coffee_machine", "dishwasher", "fridge", "freezer", "display_case", "tv", "pos_terminal"];
  const LISTS = { table: "tables", zone: "zones", climateDevice: "climateDevices", sensor: "environmentalSensors", fixture: "fixtures",
    wall: "walls", opening: "openings", label: "labels" };
  let selected = null;

  function drawLegend() {
    const colors = $("theme").value === "illustrated" ? ILLUSTRATED_THEME.status : DEFAULT_THEME.status;
    $("legend").innerHTML = Object.entries(colors).map(([k, c]) => `<span class="sw" style="background:${c}"></span><span>${k}</span>`).join("");
  }
  const stateFor = (p) => states.find((s) => s.planId === p?.planId) || null;

  async function getJson(url) { const r = await fetch(url, { cache: "no-cache" }); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }

  function render() {
    if (!plan) return;
    const state = stateFor(plan), live = $("live").checked && !!state;
    const build = $("theme").value === "illustrated" ? buildIllustratedScene : buildScene;
    drawLegend();
    const scene = build(plan, {
      tableStates: live ? state : null,
      readings: live && telemetry && telemetry.planId === plan.planId ? { [telemetry.sensorId]: telemetry } : null,
      showChairs: $("chairs").checked,
      walls3d: $("walls3d").checked,
      highlightReview: $("review").checked,
      showBackground: false,
      objectStates: objStatesFor(plan),
    });
    $("stage").innerHTML = toSvg(scene, { title: plan.name, animate: $("animate").checked });
  }

  function findObject(id) {
    const floor = plan.floors[0];
    for (const [type, key] of Object.entries(LISTS)) {
      const o = (floor[key] || []).find((x) => x.id === id);
      if (o) return { type, o };
    }
    return null;
  }

  function canOpen(type, o) {
    return (type === "fixture" && o.kind === "pergola") || (type === "wall" && ["glass_folding", "glass_sliding"].includes(o.kind)) || type === "opening";
  }

  function show(id) {
    const found = findObject(id);
    if (!found) return;
    selected = id;
    const { type, o } = found, floor = plan.floors[0];
    const st = stateFor(plan)?.tables.find((t) => t.tableId === id);
    const zone = floor.zones.find((z) => z.id === o.zoneId);
    const rows = { id: o.id, number: o.number, name: o.name, type, kind: o.kind, seats: o.seats, zone: zone ? zone.name : o.zoneId,
      floor: o.appearance?.floor, material: o.appearance?.material, roof: o.appearance?.roof, seating: o.chairStyle?.kind,
      status: st?.status, guests: st?.guestCount, order: st?.orderId, confidence: o.confidence,
      "needs review": o.needsReview ? "yes" : undefined };
    $("info").innerHTML = Object.entries(rows).filter(([, v]) => v != null)
      .map(([k, v]) => `<dt>${k}</dt><dd>${String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</dd>`).join("");

    // component controls: active / open / power, written to the live object state
    const live = objStatesFor(plan), eff = resolveState(o, live);
    const set = (patch) => { live.set(id, { ...(live.get(id) || {}), objectId: id, ...patch }); render(); show(id); };
    let html = `<div class="controls"><label>Active <input type="checkbox" id="c-active" ${eff.active ? "checked" : ""}></label>`;
    if (canOpen(type, o)) html += `<label>Open <input type="range" id="c-open" min="0" max="100" value="${Math.round(eff.open * 100)}"> <span>${Math.round(eff.open * 100)}%</span></label>`;
    if (type === "climateDevice" || (type === "fixture" && APPLIANCES.includes(o.kind))) {
      html += `<label>Power <input type="checkbox" id="c-power" ${eff.power !== "off" ? "checked" : ""}></label>`;
      html += `<label>Level <input type="range" id="c-level" min="0" max="100" value="${Math.round(eff.level * 100)}"> <span>${Math.round(eff.level * 100)}%</span></label>`;
    }
    const refs = (o.externalRefs || []).map((r) => `${r.system}:${r.id}`).join(", ");
    if (refs) html += `<span class="muted">Linked to ${refs.replace(/[&<>]/g, "")}</span>`;
    html += `<span class="muted">Changes go to the live object state; the plan itself is not modified.</span></div>`;
    $("controls").innerHTML = html;
    $("c-active").addEventListener("change", (e) => set({ active: e.target.checked }));
    $("c-open")?.addEventListener("input", (e) => set({ open: e.target.value / 100 }));
    $("c-power")?.addEventListener("change", (e) => set({ power: e.target.checked ? "on" : "off" }));
    $("c-level")?.addEventListener("input", (e) => set({ level: e.target.value / 100 }));
  }

  $("stage").addEventListener("click", (e) => {
    const el = e.target.closest("[data-ref-id]");
    if (el) show(el.dataset.refId);
  });

  async function loadPlan(url) {
    try { plan = await getJson(url); selected = null; $("controls").innerHTML = ""; render(); }
    catch (err) { $("stage").innerHTML = `<p class="err">Could not load ${url}. Serve the repository over HTTP (e.g. <code>python -m http.server</code>) and open /demo/.</p>`; }
  }

  $("plan").addEventListener("change", (e) => loadPlan(e.target.value));
  for (const id of ["theme", "walls3d", "animate", "live", "chairs", "review"]) $(id).addEventListener("change", render);
  $("open").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { plan = JSON.parse(await f.text()); render(); }
    catch (err) { $("stage").innerHTML = `<p class="err">Not a valid JSON file.</p>`; }
  });

  try {
    const [a, b, t, o] = await Promise.all(["table-state.json", "restaurant-state.json", "telemetry.json", "restaurant-objects.json"]
      .map((n) => getJson(`../examples/${n}`)));
    states.push(a, b); telemetry = t;
    rawObjectDocs.set(o.planId, o);
  } catch {}
  loadPlan($("plan").value);
</script>
</body>
</html>
