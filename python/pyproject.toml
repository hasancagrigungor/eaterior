[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eaterior"
version = "1.9.0"
description = "Validator, migrator and image-detection importer for Eaterior, an open JSON format for restaurant, cafe and bar floor plans"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hasan Cagri Gungor" }]
dependencies = ["jsonschema>=4.18"]
keywords = ["floor-plan", "restaurant", "cafe", "bar", "pos", "json-schema", "digital-twin", "validator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hasancagrigungor/eaterior"
Documentation = "https://github.com/hasancagrigungor/eaterior/blob/main/docs/specification.md"
Repository = "https://github.com/hasancagrigungor/eaterior"
Issues = "https://github.com/hasancagrigungor/eaterior/issues"
Changelog = "https://github.com/hasancagrigungor/eaterior/blob/main/CHANGELOG.md"

[project.scripts]
eaterior = "eaterior.cli:main"

[tool.setuptools]
packages = ["eaterior"]

[tool.setuptools.package-data]
eaterior = ["schemas/*.json", "py.typed"]
